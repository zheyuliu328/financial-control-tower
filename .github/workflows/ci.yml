name: CI Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ruff==0.16.6
      # Explicit Python scope; historical Markdown design snippets are not runtime code.
      - run: python -m ruff check src scripts tests main.py quick_demo.py fraud_rule_metrics.py
      - run: python -m ruff format --check src scripts tests main.py quick_demo.py fraud_rule_metrics.py
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -m 'not e2e' --cov=financial_control_tower --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build pytest
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - run: python -m pytest -m e2e
      - name: Installed CLI outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          fct --sample --output "$RUNNER_TEMP/fct-wheel-example"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-wheel-example
          path: ${{ runner.temp }}/fct-wheel-example/
          if-no-files-found: error
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update inherited packaging tools before dependency audit
        run: python -m pip install --upgrade pip 'setuptools>=83.0.0'
      - run: python -m pip install '.[dev]' pip-audit
      - run: bash scripts/verify.sh
      - name: Dependency vulnerability check
        run: python -m pip_audit
  compatibility:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
